name: Daily AI News

on:
  schedule:
    # UTC 23:00 = Asia/Shanghai 07:00（备用；推荐用外部 cron 调 workflow_dispatch）
    - cron: "0 23 * * *"
  repository_dispatch:
    types: [daily-news]
  workflow_dispatch:
    inputs:
      date:
        description: "Override report date YYYY-MM-DD (default: yesterday CST)"
        required: false
      force:
        description: "Overwrite existing digest (true/false)"
        required: false
        default: "false"

permissions:
  contents: write

env:
  TZ: Asia/Shanghai

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate daily news
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          ARGS=()
          if [ -n "${{ inputs.date }}" ]; then
            ARGS+=(--date="${{ inputs.date }}")
          fi
          if [ "${{ inputs.force }}" = "true" ]; then
            ARGS+=(--force)
          fi
          node scripts/generate-daily-news.mjs "${ARGS[@]}"

      - name: Sync to website
        run: npm run sync:news && npm run build:home

      - name: Commit and push
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news website/public/news website/news \
            website/.vitepress/news-recent.generated.json \
            website/.vitepress/news-items.generated.json \
            website/.vitepress/sidebar.news.generated.mjs \
            website/index.md || true
          if git diff --cached --quiet; then
            echo "No news changes to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore(news): daily digest $(TZ=Asia/Shanghai date +%F)"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # GITHUB_TOKEN 推送不会触发 CI，所以这里直接构建并部署到 gh-pages
      - name: Build site
        if: steps.commit.outputs.changed == 'true'
        run: npm run build

      - name: Deploy to gh-pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          commit_info=$(git describe --all --always --long)
          deploy_branch=gh-pages
          repo_url="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          cd website/.vitepress/dist
          git config --global init.defaultBranch "$deploy_branch"
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "auto deploy news, $commit_info"
          git remote add origin "$repo_url"
          git push origin "HEAD:$deploy_branch" --force
