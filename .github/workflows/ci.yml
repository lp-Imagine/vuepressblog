name: CI

on:
  push:
    branches:
      - master
      - main
  repository_dispatch:
    types: [blog-sync]
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  TZ: Asia/Shanghai

jobs:
  build:
    # ai-article 同步会先 push 封面/正文，再发 repository_dispatch；跳过中间 push，只保留 dispatch 触发部署
    if: |
      github.event_name != 'push' ||
      !startsWith(github.event.head_commit.message, 'blog-sync:')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          commit_info=$(git describe --all --always --long)
          user_name=$(git log -1 --pretty=format:'%an')
          user_email=$(git log -1 --pretty=format:'%ae')
          deploy_branch=gh-pages
          repo_url="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          cd website/.vitepress/dist
          git config --global init.defaultBranch "$deploy_branch"
          git init
          git config user.name "$user_name"
          git config user.email "$user_email"
          git add -A
          git commit -m "auto deploy, $commit_info"
          git remote add origin "$repo_url"
          git push origin "HEAD:$deploy_branch" --force
