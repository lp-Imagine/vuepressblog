<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Penn Notes">
  <!-- soft plate -->
  <rect width="64" height="64" rx="16" fill="#0a0a0c"/>
  <rect x="2.25" y="2.25" width="59.5" height="59.5" rx="14.5" fill="#141418" stroke="#5c73e7" stroke-width="1.75"/>
  <!-- inner highlight ring -->
  <rect x="5.5" y="5.5" width="53" height="53" rx="12" stroke="rgba(168,177,255,0.18)" stroke-width="1"/>

  <!-- N (back, deeper blue) -->
  <path
    fill="#6e83ec"
    fill-rule="evenodd"
    d="M33.2 18.5h5.1L46.8 34.2V18.5h5.4V45.5h-5.1L38.6 29.8V45.5h-5.4V18.5z"
    opacity="0.92"
  />

  <!-- P (front, soft lavender) -->
  <path
    fill="#c0c6ff"
    d="M14.8 18.5h14.2c6.85 0 11.35 3.85 11.35 9.85 0 6.05-4.5 9.9-11.35 9.9H20.6V45.5h-5.8V18.5zm5.8 5.1v9.5h7.85c3.35 0 5.35-1.75 5.35-4.75s-2-4.75-5.35-4.75H20.6z"
  />

  <!-- small notebook tick under monogram -->
  <path
    d="M22 50.2h20"
    stroke="#a8b1ff"
    stroke-width="1.6"
    stroke-linecap="round"
    opacity="0.45"
  />
</svg>
